[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monomech"
version = "0.15.21"
description = "Single camera biomechanics library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
authors = [
  { name = "Cole Hagen" }
]
keywords = ["biomechanics", "opensim", "monocular", "pose-estimation", "motion-capture"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "imageio>=2.34,<3",
  "packaging>=24,<26",
  "scipy>=1.13,<1.15",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
pose = [
  "mediapipe>=0.10.31,<0.11",
  "opencv-python-headless>=4.8,<5",
]
opensim = [
  "pyopensim>=4.5.2.0,<5",
]
animation = [
  "pyopensim>=4.5.2.0,<5",
  "pyvista>=0.44,<1",
  "pygltflib>=1.16,<2",
]
all = [
  "mediapipe>=0.10.31,<0.11",
  "opencv-python-headless>=4.8,<5",
  "pyopensim>=4.5.2.0,<5",
  "pyvista>=0.44,<1",
  "pygltflib>=1.16,<2",
]
notebook = [
  "jupyter>=1,<2",
  "ipykernel>=6,<7",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "build>=1.2,<2",
  "twine>=5,<6",
]

[project.urls]
Homepage = "https://pypi.org/project/monomech/"
Documentation = "https://chags1313.github.io/monomech/"
Repository = "https://github.com/chags1313/monomech"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monomech = [
  "data/*.osim",
  "data/*.task",
  "data/README.md",
  "data/Geometry/*.vtp",
  "py.typed",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
pythonpath = ["src"]
