[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "monomech"
version = "0.4.1"
description = "Monocular Biomechanics toolkit for modular pose processing, global pose estimation, and OpenSim workflows."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Cole Hagen", email = "hagencolej@gmail.com" }
]
keywords = ["biomechanics", "opencv", "mediapipe", "opensim", "motion-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "plotly>=5.20",
  "ipython>=8.0",
  "ipywidgets>=8.1",
  "opencv-python>=4.8",
  "mediapipe>=0.10.33",
  "jinja2>=3.1",
  "lxml>=5.0",
  "pydantic>=2.6",
  "typing-extensions>=4.9",
]

[project.urls]
Homepage = "https://github.com/chags1313/monomech"
Documentation = "https://chags1313.github.io/monomech/"
Repository = "https://github.com/chags1313/monomech"
Issues = "https://github.com/chags1313/monomech/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/monomech"]

[tool.hatch.build.targets.sdist]
include = [
  "src/monomech",
  "tests",
  "README.md",
  "LICENSE",
  "pyproject.toml",
  "docs",
  "examples",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
warn_unused_configs = true
