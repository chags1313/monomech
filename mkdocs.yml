site_name: monomech
site_description: Notebook-first monocular biomechanics with MediaPipe, PnP, global pose, semantic forces, and OpenSim workflows.
site_url: https://chags1313.github.io/monomech/
repo_url: https://github.com/chags1313/monomech
repo_name: chags1313/monomech
edit_uri: edit/main/docs/
copyright: Copyright (c) 2026 monomech contributors

theme:
  name: material
  icon:
    logo: material/chart-timeline-variant
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Examples: examples.md
  - Modular stages:
      - Overview: stages/index.md
      - 2D pose: stages/pose2d.md
      - World 3D pose: stages/world3d.md
      - PnP calibration: stages/pnp.md
      - Global pose: stages/global-pose.md
      - External loads and forces: stages/forces.md
      - OpenSim scale, IK, and ID: stages/opensim.md
      - Full video-to-ID pipeline: stages/full-pipeline.md
  - Outputs and files: outputs.md
  - GATMA model guide: gatma-model.md
  - GitHub and releases:
      - Docs site and Pages: github-pages.md
      - Repository setup: GITHUB_SETUP.md
      - Publishing: PUBLISHING.md
      - Releasing: RELEASING.md
      - Development: DEVELOPMENT.md
      - FAQ: FAQ.md
